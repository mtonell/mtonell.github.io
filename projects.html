    let mergedLangs = new Set(p.langs || []);
    let mergedTools = new Set(p.tools || []);
    
    p.subProjects.forEach(sub => {
      (sub.langs || []).forEach(lang => mergedLangs.add(lang));
      (sub.tools || []).forEach(tool => mergedTools.add(tool));
    });
    
    p.langs = Array.from(mergedLangs);
    p.tools = Array.from(mergedTools);
  }
});

            ${p.langs.map(l => `<span class="tag lang">${l}</span>`).join("")}
            ${p.tools.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join("")}
            ${p.tools.length > 3 ? `<span class="tag">+${p.tools.length - 3}</span>` : ""}
          </div>
          <div class="row-actions">
            ${actionBtns}
            <i class="fas fa-chevron-down toggle-icon"></i>
          </div>
        </div>
        <div class="row-details">
          <div class="details-content">
            <div style="font-weight: 600; color: var(--accent-blue); margin-bottom: 6px; font-size: 0.85rem;">
              <i class="fas fa-layer-group me-1"></i> Technical Stack: ${p.langs.concat(p.tools).join(" · ")}
            </div>
            <ul>
              ${p.details.map(d => `<li>${d}</li>`).join("")}
            </ul>
            
            ${p.images && p.images.length > 0 ? `
              <div class="project-gallery">
                ${p.images.map(imgSrc => `<img src="${imgSrc}" alt="Project Visual" loading="lazy" onclick="openLightbox(this.src)" />`).join("")}
              </div>
            ` : ""}

            ${subProjectsHtml}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function toggleRow(idx) {
  const row = document.getElementById(`row-${idx}`);
  row.classList.toggle("open");
}

// Lightbox Logic
function openLightbox(src) {
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  lightbox.style.display = "block";
  lightboxImg.src = src;
  document.body.style.overflow = "hidden"; // Prevent background scrolling
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = "none";
  document.body.style.overflow = "auto"; // Restore background scrolling
}

// Permission Modal Logic
function openPermissionModal(link) {
  const modal = document.getElementById('permissionModal');
  const btn = document.getElementById('askPermissionBtn');
  btn.href = link; // Sets the Google Drive link
  modal.style.display = "flex"; // Show the modal
  document.body.style.overflow = "hidden"; // Prevent background scrolling
}

function closePermissionModal(e) {
  if(e) e.stopPropagation();
  document.getElementById('permissionModal').style.display = "none";
  document.body.style.overflow = "auto";
}

renderRows(projects);

// Build Dynamic Filter Dropdown Buttons
function buildFilterDropdown() {
  const topics = new Set();
  const langs = new Set();
  const tools = new Set();
  
  projects.forEach(p => {
    if(p.topics) p.topics.forEach(t => topics.add(t));
    if(p.langs) p.langs.forEach(l => langs.add(l));
    if(p.tools) p.tools.forEach(t => tools.add(t));
  });
  
  const menu = document.getElementById('filterDropdown');
  let html = `<div style="margin-bottom: 12px;"><button class="filter-chip active" style="width: 100%; justify-content: center; margin:0;" onclick="setFilter('all', this)">All Projects</button></div>`;
  
  if (topics.size > 0) {
    html += `<div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin: 10px 0 8px;">Topics</div>`;
    html += `<div style="display: flex; flex-wrap: wrap; gap: 6px;">`;
    Array.from(topics).sort().forEach(t => html += `<button class="filter-chip" style="padding: 4px 10px; font-size: 0.75rem; margin:0;" onclick="setFilter('${t}', this)">${t}</button>`);
    html += `</div>`;
  }
  
  if (langs.size > 0) {
    html += `<div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin: 16px 0 8px;">Languages</div>`;
    html += `<div style="display: flex; flex-wrap: wrap; gap: 6px;">`;
    Array.from(langs).sort().forEach(l => html += `<button class="filter-chip" style="padding: 4px 10px; font-size: 0.75rem; margin:0;" onclick="setFilter('${l}', this)">${l}</button>`);
    html += `</div>`;
  }
  
  if (tools.size > 0) {
    html += `<div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin: 16px 0 8px;">Tools & Stack</div>`;
    html += `<div style="display: flex; flex-wrap: wrap; gap: 6px;">`;
    Array.from(tools).sort().forEach(t => html += `<button class="filter-chip" style="padding: 4px 10px; font-size: 0.75rem; margin:0;" onclick="setFilter('${t}', this)">${t}</button>`);
    html += `</div>`;
  }
  
  menu.innerHTML = html;
}
buildFilterDropdown();

// Filter & Search Logic
const searchInput = document.getElementById("searchInput");
let activeFilter = 'all';

function setFilter(value, btnElement) {
  activeFilter = value;
  document.getElementById('filterLabel').innerText = value === 'all' ? 'All Projects' : value;
  document.getElementById('filterDropdown').style.display = 'none';
  
  // Update active class
  document.querySelectorAll('#filterDropdown .filter-chip').forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');
  
  applyFilters();
}

// Custom toggle dropdown
document.getElementById('filterDropdownToggle').onclick = function(e) {
  e.stopPropagation();
  const dropdown = document.getElementById('filterDropdown');
  dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
};

// Close dropdown if clicked outside
document.addEventListener('click', function(event) {
  const container = document.getElementById('filterContainer');
  const dropdown = document.getElementById('filterDropdown');
  if (container && !container.contains(event.target)) {
    if (dropdown) dropdown.style.display = 'none';
  }
});

function applyFilters() {
  const query = searchInput.value.toLowerCase().trim();
  const sortMode = document.getElementById("sortSelect").value;
  let filtered = projects.filter(p => {
    const matchesFilter = activeFilter === "all" || 
      (p.topics || []).includes(activeFilter) || 
      (p.langs || []).includes(activeFilter) || 
      (p.tools || []).includes(activeFilter);
    const matchesSearch = query === "" || 
      p.title.toLowerCase().includes(query) || 
      p.desc.toLowerCase().includes(query) || 
      (p.category && p.category.toLowerCase().includes(query)) ||
      (p.year && p.year.includes(query)) ||
      (p.tools || []).some(t => t.toLowerCase().includes(query)) ||
      (p.langs || []).some(l => l.toLowerCase().includes(query)) ||
      (p.topics || []).some(t => t.toLowerCase().includes(query));
    return matchesFilter && matchesSearch;
  });
  
  filtered.sort((a, b) => {
    if (sortMode === 'year_desc') {
      const yearA = parseInt(a.year) || 0;
      const yearB = parseInt(b.year) || 0;
      return yearB - yearA;
    } else if (sortMode === 'year_asc') {
      const yearA = parseInt(a.year) || 9999;
      const yearB = parseInt(b.year) || 9999;
      return yearA - yearB;
    } else if (sortMode === 'alpha') {
      return a.title.localeCompare(b.title);
    } else {
      return a.originalIndex - b.originalIndex;
    }
  });

  renderRows(filtered);
}

searchInput.addEventListener("input", applyFilters);
</script>
