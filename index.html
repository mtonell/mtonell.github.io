<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matteo Tonello — Home</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Specific styles for centered landing portal */
    body {
      padding-top: 0; /* Override style.css */
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .landing-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
    }
    
    .landing-hero {
      margin-bottom: 2.5rem;
    }

    .landing-hero h1 {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .landing-hero p {
      font-size: 1.25rem;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .landing-contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .contact-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 50px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    
    .contact-pill:hover {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .contact-pill i {
      color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <main class="landing-container">
    <div class="landing-hero">
      <h1>Matteo Tonello</h1>
      <p style="font-size: 1.35rem; color: var(--accent-blue); font-weight: 600; margin-bottom: 0.25rem;">AI & Robotics Engineer</p>
      <p style="font-size: 0.95rem; color: var(--text-muted); font-weight: 500; margin-bottom: 2.5rem;">Master in AI & Robotics Engineering &bull; Università di Padova (110 cum laude)</p>
      <a href="projects" class="btn btn-primary" style="font-size: 1rem; padding: 12px 28px; border-radius: 50px;">
        <i class="fas fa-layer-group"></i> View Projects
      </a>
    </div>

    <div class="landing-contacts">
      <a href="mailto:matteo.tonello.2001@gmail.com" class="contact-pill">
        <i class="fas fa-envelope"></i> Email
      </a>
      <a href="https://github.com/mtonell" target="_blank" rel="noopener" class="contact-pill">
        <i class="fab fa-github"></i> GitHub
      </a>
      <a href="https://linkedin.com/in/tonello-matteo" target="_blank" rel="noopener" class="contact-pill">
        <i class="fab fa-linkedin"></i> LinkedIn
      </a>
    </div>
  </main>

  <script data-goatcounter="https://mtonell.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
